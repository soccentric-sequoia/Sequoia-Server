version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sequoia-postgres
    environment:
      POSTGRES_DB: sequoia
      POSTGRES_USER: sequoia
      POSTGRES_PASSWORD: sequoia_dev
    ports:
      - "5432:5432"
    volumes:
      - sequoia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequoia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sequoia_pgdata:
